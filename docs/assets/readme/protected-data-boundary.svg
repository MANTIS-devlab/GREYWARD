<svg xmlns="http://www.w3.org/2000/svg" width="840" height="581" viewBox="0 0 840 581" role="img" aria-labelledby="t d">
<title id="t">Protected Data boundary</title><desc id="d">Conceptual policy check for explicitly registered Protected Data. Unauthorized domains are denied by SELinux kernel policy; specific supported workflows may be permitted.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15202A"/><stop offset="1" stop-color="#0C1116"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#8DA4B3"/></marker><marker id="rarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#BF737E"/></marker><marker id="garr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#82B9B2"/></marker></defs>
<rect width="840" height="581" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="838" height="579" rx="17" fill="none" stroke="#33424F" stroke-width="1.5"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="36" y="42" fill="#8FB9C4" font-size="13" letter-spacing="2.3" font-weight="700">PROTECTED DATA / CONCEPTUAL BOUNDARY</text><text x="36" y="83" fill="#F3F6F8" font-size="30" font-weight="650">Access is decided below the UI.</text><text x="36" y="110" fill="#A6B6C1" font-size="14.5">Protection applies to explicitly enrolled resources.</text></g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
