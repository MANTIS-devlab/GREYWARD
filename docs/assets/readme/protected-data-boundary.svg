 <rect x="260" y="345" width="320" height="79" rx="11" fill="#25333C" stroke="#89B0BA" stroke-width="1.7"/>
 <path d="M420 208 V241 M420 312 V345" stroke="#8DA4B3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
 <path d="M368 424 V449 H222 V461" stroke="#82B9B2" stroke-width="2" fill="none" marker-end="url(#garr)"/>
 <path d="M472 424 V449 H619 V461" stroke="#BF737E" stroke-width="2" fill="none" marker-end="url(#rarr)"/>
