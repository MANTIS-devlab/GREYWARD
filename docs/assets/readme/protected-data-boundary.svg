 <g fill="#EDF4F7" text-anchor="middle" font-size="18" font-weight="650"><text x="420" y="167">Application request</text><text x="420" y="270">Registered protected resource</text><text x="420" y="375">SELinux access check</text><text x="220" y="490">PERMITTED</text><text x="619" y="490">DENIED</text></g>
 <g fill="#ACC0CB" text-anchor="middle" font-size="13.5"><text x="420" y="190">Ordinary or supported execution context</text><text x="420" y="294">Explicit enrollment and labels</text><text x="420" y="400">Mandatory operating-system enforcement</text><text x="220" y="513">Specifically supported authorization path</text><text x="619" y="513">Unauthorized domain</text></g>
 <text x="36" y="556" fill="#8D9CA8" font-size="12">NOT A GENERIC PERMISSION POPUP OR DATA-LOSS PREVENTION MECHANISM</text>
</g></svg>
