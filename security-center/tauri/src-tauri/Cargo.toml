[package]
name = "greyward-security-center"
version = "0.1.0"
description = "GREYWARD Security Center Tauri application"
authors = ["MANTIS SYSTEMS"]
edition = "2024"
rust-version.workspace = true
license.workspace = true

[lib]
name = "greyward_security_center_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
dbus = "0.9.12"
greyward-security-backends = { path = "../../crates/greyward-security-backends" }
greyward-security-domain = { path = "../../crates/greyward-security-domain" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process"] }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"


[features]
custom-protocol = ["tauri/custom-protocol"]
