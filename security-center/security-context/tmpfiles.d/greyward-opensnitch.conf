# Keep the daemon log readable only by root and the authorized wheel group.
f /var/log/opensnitchd.log 0640 root wheel -
# Runtime evidence outlives process restarts; systemd clears /run at boot.
d /run/greyward-opensnitch 0750 root root -
d /run/greyward-security-context 0750 root wheel -
# Isolate the observer's writable handoff from OpenSnitch control state.
d /run/greyward-flow-evidence 0750 root wheel -
