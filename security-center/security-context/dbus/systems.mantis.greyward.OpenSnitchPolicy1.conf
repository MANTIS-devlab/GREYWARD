<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root">
  <allow own="systems.mantis.greyward.OpenSnitchPolicy1"/>
  <allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1"/>
 </policy>
 <policy group="wheel"><allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1"/></policy>
 <policy context="default">
  <!-- Ordinary callers may inspect the bounded projection, but not mutate it.
       Mutation is reserved for the explicit wheel policy above. -->
  <allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  <allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="ListRules"/>
  <allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="GetFirewallState"/>
  <allow send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="GetRules"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="Preview"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="Apply"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="Cancel"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="SetRule"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="SetThreatException"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="SetThreatIntelEnabled"/>
  <deny send_destination="systems.mantis.greyward.OpenSnitchPolicy1" send_interface="systems.mantis.greyward.OpenSnitchPolicy1" send_member="RemoveRule"/>
 </policy>
</busconfig>
