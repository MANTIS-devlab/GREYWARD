<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root"><allow own="systems.mantis.greyward.SecureDns1"/></policy>
 <policy group="wheel"><allow send_destination="systems.mantis.greyward.SecureDns1" send_interface="systems.mantis.greyward.SecureDns1"/></policy>
 <policy context="default">
  <!-- Security Context needs only to discover and read the bounded state. Do
       not expose SetMode/SetProvider/RetrySecureDns to ordinary callers. -->
  <allow send_destination="systems.mantis.greyward.SecureDns1"
         send_interface="org.freedesktop.DBus.Introspectable"
         send_member="Introspect"/>
  <allow send_destination="systems.mantis.greyward.SecureDns1"
         send_interface="systems.mantis.greyward.SecureDns1"
         send_member="GetState"/>
  <deny send_destination="systems.mantis.greyward.SecureDns1"
        send_interface="systems.mantis.greyward.SecureDns1"
        send_member="SetMode"/>
  <deny send_destination="systems.mantis.greyward.SecureDns1"
        send_interface="systems.mantis.greyward.SecureDns1"
        send_member="SetProvider"/>
  <deny send_destination="systems.mantis.greyward.SecureDns1"
        send_interface="systems.mantis.greyward.SecureDns1"
        send_member="RetrySecureDns"/>
 </policy>
</busconfig>
