<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root"><allow own="systems.mantis.greyward.ClamAvScan1"/></policy>
 <policy group="wheel"><allow send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1"/></policy>
 <policy context="default">
  <allow send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  <allow send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="GetScanStatus"/>
  <allow send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="GetFileSecuritySummary"/>
  <allow send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="ListFileDetections"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="ScanPath"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="StartScan"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="CancelScan"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="QuarantineDetection"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="CompleteQuarantine"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="FailQuarantine"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="RestoreDetection"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="CompleteRestore"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="FailRestore"/>
  <deny send_destination="systems.mantis.greyward.ClamAvScan1" send_interface="systems.mantis.greyward.ClamAvScan1" send_member="DeleteDetection"/>
 </policy>
</busconfig>
