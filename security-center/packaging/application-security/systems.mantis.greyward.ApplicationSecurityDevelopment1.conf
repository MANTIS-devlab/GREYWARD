<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Separate-account provider only. Kernel peer checks and fresh owner Polkit
     remain mandatory; this policy supplies no grant or enrollment authority. -->
<busconfig>
  <policy context="default">
    <deny own="systems.mantis.greyward.ApplicationSecurityDevelopment1"/>
    <deny send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1"/>
  </policy>
  <policy user="root">
    <allow own="systems.mantis.greyward.ApplicationSecurityDevelopment1"/>
  </policy>
  <policy user="greyward-guard-probe">
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="ReadSecurityEvents"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="ListAccessGrants"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="ListApplications"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="GetApplication"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="GetCoverage"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="ListProtectedResources"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="GetProtectedResource"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PreviewResourceRegistration"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PreviewPolicyChange"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PreviewGrantRevocation"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="ApplyPolicyChange"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="GetOperation"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="CancelOperation"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PrepareLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PrepareIsolatedLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PrepareGraphicalLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="PrepareSelectedDocumentLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="StartPreparedLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="systems.mantis.greyward.ApplicationSecurity1" send_member="GetLaunch"/>
    <allow send_destination="systems.mantis.greyward.ApplicationSecurityDevelopment1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>
</busconfig>
