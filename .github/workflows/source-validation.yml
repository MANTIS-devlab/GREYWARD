name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-secrets:
    name: Public history and source secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and run pinned secret scanner
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/greyward-secret-scanner
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/greyward-secret-scanner
          /tmp/greyward-secret-scanner/gitleaks git . --redact --log-opts=--all
          /tmp/greyward-secret-scanner/gitleaks dir . --redact
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        shell: pwsh
        run: ./tests/static.ps1
      - name: Repository checks
        shell: pwsh
        run: ./tools/validate-repository.ps1
      - name: Public source boundary
        run: |
          python3 -m unittest tests.test_public_export
          python3 tools/public-export.py --source . --check-public

  frontend:
    name: Frontend source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node contracts
        working-directory: security-center
        run: |
          npm --prefix tauri ci
          node --test tauri/frontend/interaction.test.mjs
          node --test tauri/frontend/startup.test.mjs
          node --test tauri/frontend/performance.test.mjs
          node --test tauri/frontend/ux-contract.test.mjs
          node --test tauri/frontend/network-rules.test.mjs

  python:
    name: Python source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python system bindings
        run: sudo apt-get update && sudo apt-get install -y python3-dbus python3-gi
      - name: Security Context tests
        working-directory: security-center
        env:
          PYTHONPATH: security-context
        run: /usr/bin/python3 -m unittest discover -s security-context/tests -p 'test_*.py'
      - name: Image source tests
        run: /usr/bin/python3 -m unittest tests.test_image_baseline tests.test_image_offline tests.test_image_stage_text
      - name: Protected USB approval and ISO regression contracts
        run: /usr/bin/python3 -m unittest tests.test_application_authentication tests.test_dms_build_inputs tests.test_dms_package_verify tests.test_dms_shell_migration tests.test_usbguard_release_inputs

  rust:
    name: Rust source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsqlite3-dev libseccomp-dev
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - name: Check workspace
        working-directory: security-center
        run: |
          cargo fmt --all -- --check
          # Ten checks need a real SELinux process context and one needs an
          # installed Fedora RPM identity. Retain them for explicit Fedora gates.
          cargo test --workspace --locked -- \
            --skip policy_intent::tests:: \
            --skip absent_enrollment_is_unavailable_empty_inventory_is_unknown_and_expired_work_fails \
            --skip records_and_verified_provenance_cannot_establish_protection_or_inventory_completeness \
            --skip caller_scope_and_revision_are_enforced_across_pagination_and_detail \
            --skip an_exited_caller_does_not_receive_an_empty_successful_projection \
            --skip a_real_pidfd_resolves_the_live_peer_without_guessing_an_application \
            --skip exit_invalidates_a_held_execution_and_stale_credentials \
            --skip exec_to_another_object_invalidates_a_preview_peer \
            --skip copied_paths_cannot_acquire_installed_path_evidence
          cargo clippy --workspace --all-targets --locked -- -D warnings
