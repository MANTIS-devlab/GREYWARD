# GREYWARD Anaconda profile layered on Fedora's supported profile.
# Detection remains Fedora-specific so the base product identity and native
# installer behavior are preserved while GREYWARD owns the presentation layer.
[Profile]
profile_id = greyward
base_profile = fedora

[Profile Detection]
os_id = fedora

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/greyward-anaconda.css
# GREYWARD owns the first account in the graphical Anaconda workflow. Fedora
# Workstation hides these pages because GNOME Initial Setup creates the account
# after reboot; that path is not part of GREYWARD. The explicit lists below
# keep account, language and keyboard controls visible in either UI generation.
# Software selection is the only hidden page: the complete ISO-local package
# closure is already supplied by Kickstart, with no selectable environments.
hidden_spokes = SoftwareSelectionSpoke
hidden_webui_pages = anaconda-screen-software-selection

[Localization]
# English is the initial language. Never infer a different keyboard from the
# tester's network location; native Keyboard selection remains interactive.
use_geolocation = False
