# GREYWARD Anaconda profile layered on Fedora's supported profile.
# Detection remains Fedora-specific so the base product identity and native
# installer behavior are preserved while GREYWARD owns the presentation layer.
[Profile]
profile_id = greyward
base_profile = fedora

[Profile Detection]
os_id = fedora

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/greyward-anaconda.css
# GREYWARD owns the first account in the graphical Anaconda workflow. Fedora
# Workstation hides these pages because GNOME Initial Setup creates the account
# after reboot; that path is not part of GREYWARD. Empty values explicitly
# clear inherited suppression in either Anaconda UI generation.
hidden_spokes =
hidden_webui_pages =
