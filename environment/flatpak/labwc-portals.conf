[preferred]
default=gtk
# Protected Labwc does not grant ordinary applications frame capture.
# The shell-owned Print shortcut has a separate, compositor-controlled path.
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Screenshot=none
# Labwc has no Mutter service channel. Do not let the broker wake GNOME's
# backend as a fallback for interfaces the GTK and wlroots backends do not
# own; expose those capabilities only when GREYWARD adds a Labwc-compatible
# owner.
org.freedesktop.impl.portal.Background=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.Lockdown=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.Usb=none
org.freedesktop.impl.portal.Wallpaper=none
