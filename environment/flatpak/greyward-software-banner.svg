<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">GREYWARD Software</title>
  <desc id="desc">A quiet graphite banner for the GREYWARD Software application.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="0.58" stop-color="#151c24"/>
      <stop offset="1" stop-color="#263039"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dde3" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#d7dde3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d7dde3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0H72M0 0V72" fill="none" stroke="#d7dde3" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1600" height="440" rx="28" fill="url(#surface)"/>
  <rect width="1600" height="440" rx="28" fill="url(#grid)"/>
  <ellipse cx="1280" cy="120" rx="360" ry="180" fill="#9eb4c6" fill-opacity="0.12" filter="url(#soft)"/>
  <path d="M0 360C270 285 465 388 742 316S1220 184 1600 275" fill="none" stroke="url(#sheen)" stroke-width="2"/>
  <path d="M0 376C276 301 473 404 756 332S1228 200 1600 291" fill="none" stroke="#cbd4dc" stroke-opacity="0.08"/>
  <g fill="#eef2f5" font-family="Inter, Noto Sans, sans-serif">
    <text x="92" y="182" font-size="46" font-weight="650" letter-spacing="7">GREYWARD</text>
    <text x="96" y="232" font-size="18" font-weight="500" letter-spacing="3" fill="#b8c2cb">SOFTWARE</text>
    <text x="96" y="300" font-size="20" fill="#d4dbe1">Private tools, considered carefully.</text>
  </g>
  <image href="file://__GREYWARD_HOME__/.config/bazaar/greyward-symbol.svg" x="1300" y="78" width="230" height="230" opacity="0.82" preserveAspectRatio="xMidYMid meet"/>
</svg>
