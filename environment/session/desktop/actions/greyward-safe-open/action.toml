schema_version = 1
id = "greyward-safe-open"
name = "Open with Safe Open"
description = "Start this file through GREYWARD's restricted Application Guard workflow."
icon = "lock"
enabled = true
menu = "top"

[when]
kinds = ["file"]
min_items = 1
max_items = 1

[run]
runtime = "command"
program = "/usr/bin/greyward-file-context"
args = ["--safe-open", "{path}"]
mode = "per-item"
on_error = "stop"
working_directory = "home"
confirm = false
