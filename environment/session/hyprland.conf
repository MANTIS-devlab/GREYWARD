monitor = ,2560x1440@60,auto,1
$terminal = /usr/bin/env GREYWARD_TERMINAL_BRIEF=1 SHELL=/usr/bin/zsh blackbox-terminal
source = ~/.config/hypr/greyward-decoration.tokens.conf

input {
    kb_layout = fr
    follow_mouse = 1
}

general {
    gaps_in = 8
    # Hyprland 0.56.2 has a known edge-grab resize bug when gaps_out > 0.
    # Keep the visual spacing through centered floating geometry until the
    # upstream edge-grab fix is available in the guest package.
    gaps_out = 0
    float_gaps = 0
    border_size = 2
    col.active_border = rgba(b8c4d0dd)
    col.inactive_border = rgba(59616a88)
    # Keep Hyprland's layout engine available for workspaces, but the global
    # float rule below makes the user-facing model conventional desktop
    # windows rather than a tiling workflow.
    layout = dwindle
    resize_on_border = true
    # Ordinary pointer edge/corner resizing with cursor feedback.
    extend_border_grab_area = 48
    hover_icon_on_border = true
    resize_corner = 0
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 10
    active_opacity = 0.92
    inactive_opacity = 0.84
    dim_inactive = true
    dim_strength = 0.08
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
    blur {
        enabled = true
        size = 10
        passes = 3
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = greyward, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, greyward
    animation = workspaces, 1, 3, greyward, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Application chrome belongs to GTK/libadwaita and Qt. GREYWARD does not
# inject a second titlebar or window-control implementation.
# hyprbars is intentionally disabled: the guest's installed binary is not
# ABI-compatible with Hyprland 0.56.2, and no unpinned server-side chrome is
# allowed back into the normal window path.
# Maximize/restore is likewise initiated by native xdg_toplevel controls;
# Hyprland 0.56.2 has no separate maximize dispatcher. Fullscreen remains
# explicit and separate through the fullscreen dispatcher below.

layerrule = blur on, match:namespace ^(greyward-panel)$
layerrule = ignore_alpha 0.05, match:namespace ^(greyward-panel)$

# Normal-desktop behavior: every ordinary application opens as a floating,
# movable and resizable window. Dialog-specific rules can refine this later.
windowrule = float on, match:class .*

bind = SUPER, RETURN, exec, uwsm app -- /usr/bin/env GREYWARD_TERMINAL_BRIEF=1 SHELL=/usr/bin/zsh blackbox-terminal
bind = SUPER, Q, killactive
bind = SUPER, F, togglefloating
bind = SUPER, M, fullscreen
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
